<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking</title>
</head>
<body>
       <table align="center" border="7">
        <tr>
          <td>
    <h1 align="center">Hotel Room Booking Form</h1>
        <form align="center">
        <label>Full Name</label>
        <input type="text">
        <br><br>

        <label>Email</label>
        <input type="email">
        <br><br>

        <label>Phone </label>
        <input type="tel">
        <br><br>

        <label> Check-in Date</label>
        <input type="date">
        <br><br>

        <label> Check-out Date</label>
        <input type="Date">
        <br><br>

        <label> Room type</label>
        <select>
            <option>Single Room</option>
            <option>Double Room</option>
            <option>suite</option>
            <option>Pent House</option>
            <option>Deluxe</option>
        </select>
        <br><br>

        <label>Number of guest</label>
        <input type="number">
        <br><br>

        <label>Special Request</label><br>
        <textarea row="5" coloumn="8"></textarea>
        <br><br>

        <button>Book Now</button>
        <button>Reset form</button>
    </form>
</td>
</tr>
</table>
</body>
</html>
